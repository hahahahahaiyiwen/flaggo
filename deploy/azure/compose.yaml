services:
  lgtm:
    image: grafana/otel-lgtm@sha256:2de1094c593c671cbfca878a28ffcd7e46ff5e32f2ce966c0cf33003f6cf4266
    environment:
      ENABLE_LOGS_OTELCOL: "true"
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3100:3100"
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:9090:9090"
      - "127.0.0.1:4320:4318"
    volumes:
      - /var/lib/flaggo/lgtm:/data
  collector:
    image: otel/opentelemetry-collector@sha256:310a800ad69ee430e7c541796852a242c9c7db97aaad4daa5ccf843c525fbdb2
    network_mode: host
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      FLAGGO_OTLP_INGESTION_ENDPOINT: http://127.0.0.1:5090
      FLAGGO_PLAYGROUND_APPLICATION_OTLP_ENDPOINT: 127.0.0.1:4318
      FLAGGO_PLAYGROUND_INTERNAL_OTLP_ENDPOINT: 127.0.0.1:4319
      FLAGGO_PLAYGROUND_COLLECTOR_HEALTH_ENDPOINT: 127.0.0.1:13133
      FLAGGO_PLAYGROUND_LGTM_OTLP_ENDPOINT: http://127.0.0.1:4320
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
