receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

exporters:
  otlphttp/flaggo:
    logs_endpoint: http://localhost:5090/v1/logs
    metrics_endpoint: http://localhost:5090/v1/metrics
    traces_endpoint: http://localhost:5090/v1/traces
    encoding: json

service:
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [otlphttp/flaggo]
    metrics:
      receivers: [otlp]
      exporters: [otlphttp/flaggo]
    traces:
      receivers: [otlp]
      exporters: [otlphttp/flaggo]
