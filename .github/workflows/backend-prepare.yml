name: Backend preparation

on:
  workflow_dispatch:
    inputs:
      replay_installed:
        description: Replay the pinned retained release without building or resolving dependencies
        type: boolean
        default: false
  push:
    branches-ignore:
      - main
    paths:
      - .github/workflows/backend-prepare.yml
      - apps/async-analysis/requirements*
      - apps/async-analysis/src/config.rs
      - modules/analysis-agent/examples/runtime-probe.rs
      - examples/tetris-playground/test/closed-loop.spec.mjs
      - deploy/azure/**
      - '!deploy/azure/README.md'
      - '!deploy/azure/*.provenance.json'

permissions:
  contents: read

jobs:
  linux-python:
    if: github.event_name != 'workflow_dispatch' || inputs.replay_installed != true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.16"
      - name: Resolve or reuse the Linux lock
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/flaggo-python"
          mkdir -p "$out"
          python -m pip install uv==0.9.15
          if test -f apps/async-analysis/requirements-linux.txt; then
            cp apps/async-analysis/requirements-linux.txt "$out/requirements-linux.txt"
          else
            uv pip compile apps/async-analysis/requirements-linux.in \
              --python-version 3.12 --python-platform x86_64-manylinux_2_28 \
              --only-binary :all: --generate-hashes \
              --default-index https://pypi.org/simple \
              --output-file "$out/requirements-linux.txt"
          fi
          uv --version > "$out/resolver-version.txt"
          printf '%s\n' "$GITHUB_SHA" > "$out/source-commit.txt"
          sha256sum "$out/requirements-linux.txt" > "$out/lock.sha256"
      - name: Verify hashes, wheels and scientific imports
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/flaggo-python"
          python -m venv "$out/venv"
          "$out/venv/bin/python" -m pip install \
            --require-hashes --only-binary=:all: \
            --index-url https://pypi.org/simple \
            --report "$out/wheel-provenance.json" \
            -r "$out/requirements-linux.txt"
          "$out/venv/bin/python" deploy/azure/verify-python.py \
            --output "$out/python-runtime.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-linux-python-${{ github.sha }}
          path: |
            ${{ runner.temp }}/flaggo-python/*.txt
            ${{ runner.temp }}/flaggo-python/*.json
            ${{ runner.temp }}/flaggo-python/*.sha256
          if-no-files-found: error
          retention-days: 7

  installed-artifact:
    if: github.event_name == 'workflow_dispatch' && inputs.replay_installed == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticate provenance and extract the pinned sealed release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy/azure/reuse-release.py --output "$RUNNER_TEMP/flaggo-replay-input"
      - name: Prepare the isolated test driver without modifying installed assets
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/flaggo-replay-input/flaggo-relocated"
          python3 "$root/deploy/azure/state-tool.py" verify-release --release "$root" \
            --release-sha256 2092cb98634600a7d76112897da8de50cf0e072a9d1565115e76a51be49ff98f
          test ! -e node_modules
          test ! -e examples/tetris-playground/dist
          test ! -e examples/tetris-integration/dist
          ln -s "$root/node_modules" node_modules
          ln -s "$root/examples/tetris-playground/dist" examples/tetris-playground/dist
          ln -s "$root/examples/tetris-integration/dist" examples/tetris-integration/dist
          "$root/node/bin/node" --check examples/tetris-playground/test/closed-loop.spec.mjs
          bash -n deploy/azure/verify-installed.sh
      - name: Run one installed reproduction and gated restart/recovery checks
        shell: bash
        run: |
          set -euo pipefail
          sudo --preserve-env=GITHUB_ACTIONS,PATH bash deploy/azure/verify-installed.sh \
            "$RUNNER_TEMP/flaggo-replay-input/flaggo-relocated" "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-installed-replay-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/flaggo-replay-input/artifact-input-provenance.json
            ${{ runner.temp }}/installed-*.json
            ${{ runner.temp }}/installed-journal.log
            ${{ runner.temp }}/analysis-stopped-parity.json
            ${{ runner.temp }}/restored-parity.json
            ${{ runner.temp }}/state-backup/backup.json
            examples/tetris-playground/test-results/
          if-no-files-found: warn
          retention-days: 7

  linux-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.16"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.5"
      - name: Build committed versioned artifacts
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal
          python -c "from pathlib import Path; assert all(b'\r' not in p.read_bytes() for p in Path('deploy/azure').glob('*.sh')), 'Linux scripts must use LF'"
          bash -n deploy/azure/verify-installed.sh
          python deploy/azure/test-preparation.py
          node --test deploy/azure/deployed-target.test.mjs
          python deploy/azure/prepare-release.py --output "$RUNNER_TEMP/flaggo-release"
      - name: Relocate and probe without credentials or maintainer caches
        shell: bash
        run: |
          set -euo pipefail
          mv "$RUNNER_TEMP/flaggo-release" "$RUNNER_TEMP/flaggo-relocated"
          root="$RUNNER_TEMP/flaggo-relocated"
          mkdir "$RUNNER_TEMP/flaggo-empty-home"
          env -i HOME="$RUNNER_TEMP/flaggo-empty-home" \
            PATH="$root/node/bin:/usr/bin:/bin" \
            COPILOT_CLI_EXTRACT_DIR="$root/copilot" \
            "$root/bin/flaggo-runtime-probe" "$RUNNER_TEMP/flaggo-empty-home" \
            > "$root/runtime-probe.json"
          env -i HOME="$RUNNER_TEMP/flaggo-empty-home" PATH="/usr/bin:/bin" \
            PYTHONHOME="$root/python" LD_LIBRARY_PATH="$root/python/lib" \
            "$root/python/bin/python3.12" "$root/deploy/azure/verify-python.py" \
            --output "$root/python-relocated.json"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/flaggo-release.tar.gz" flaggo-relocated
          sha256sum "$RUNNER_TEMP/flaggo-release.tar.gz" > "$RUNNER_TEMP/flaggo-release.sha256"
      - name: Exercise installed private services and offline recovery on the runner
        shell: bash
        run: |
          set -euo pipefail
          sudo --preserve-env=GITHUB_ACTIONS,PATH bash deploy/azure/verify-installed.sh \
            "$RUNNER_TEMP/flaggo-relocated" "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-linux-release-${{ github.sha }}
          path: |
            ${{ runner.temp }}/flaggo-release.tar.gz
            ${{ runner.temp }}/flaggo-release.sha256
            ${{ runner.temp }}/flaggo-relocated/release.json
            ${{ runner.temp }}/flaggo-relocated/runtime-probe.json
            ${{ runner.temp }}/flaggo-relocated/python-relocated.json
            ${{ runner.temp }}/installed-*.json
            ${{ runner.temp }}/installed-journal.log
            ${{ runner.temp }}/analysis-stopped-parity.json
            ${{ runner.temp }}/restored-parity.json
            ${{ runner.temp }}/state-backup/backup.json
            examples/tetris-playground/test-results/
          if-no-files-found: warn
          retention-days: 7
