name: Contracts

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: contracts/conformance/requirements.txt
      - run: python -m pip install -r contracts/conformance/requirements.txt
      - run: python tools/dev.py check

  sdk-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run check:openapi
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  decision-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore Flaggo.slnx --source https://api.nuget.org/v3/index.json
      - run: dotnet build Flaggo.slnx --configuration Release --no-restore
      - run: dotnet test Flaggo.slnx --configuration Release --no-build --no-restore
