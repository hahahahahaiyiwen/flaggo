name: Contracts

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: contracts/conformance/requirements.txt
      - run: python -m pip install -r contracts/conformance/requirements.txt
      - run: python tools/dev.py check

  sdk-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run check:openapi
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  decision-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore Flaggo.slnx --source https://api.nuget.org/v3/index.json
      - run: dotnet build Flaggo.slnx --configuration Release --no-restore
      - name: Run bounded decision-service tests with hang diagnostics
        timeout-minutes: 10
        run: |
          results_directory="$RUNNER_TEMP/decision-service-test-results"
          mkdir -p "$results_directory"
          echo "[$(date --iso-8601=seconds)] Starting bounded decision-service test command"
          dotnet test Flaggo.slnx \
            --configuration Release \
            --no-build \
            --no-restore \
            --logger "console;verbosity=detailed" \
            --blame-hang \
            --blame-hang-timeout 2m \
            --blame-hang-dump-type mini \
            --results-directory "$results_directory" \
            --diag "$results_directory/vstest.log"
      - name: Upload decision-service failure diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: decision-service-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/decision-service-test-results
          if-no-files-found: warn
          retention-days: 7

  tetris-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: npm ci
      - run: dotnet restore Flaggo.slnx --source https://api.nuget.org/v3/index.json
      - run: npm run test:tetris-integration

  adaptive-worker-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: npm ci
      - run: dotnet restore Flaggo.slnx --source https://api.nuget.org/v3/index.json
      - run: npm run test:adaptive-worker

  windows-durability:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: npm ci
      - run: dotnet restore Flaggo.slnx --source https://api.nuget.org/v3/index.json
      - run: dotnet build Flaggo.slnx --configuration Debug --no-restore
      - run: >-
          dotnet test tests/Flaggo.Decisioning.Tests/Flaggo.Decisioning.Tests.csproj
          --configuration Debug
          --no-build
          --no-restore
          --filter "FullyQualifiedName~CommittedFileSnapshotTests|FullyQualifiedName~DurableDirectoryTests|FullyQualifiedName~LocalFileAuditSinkTests"
      - name: Repeat unskippable Windows handle races
        shell: pwsh
        run: |
          1..3 | ForEach-Object {
            dotnet test tests/Flaggo.Decisioning.Tests/Flaggo.Decisioning.Tests.csproj `
              --configuration Debug `
              --no-build `
              --no-restore `
              --filter "FullyQualifiedName~CommittedFileSnapshotTests.Windows_"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Test native Windows publication helper
        run: npm test --workspace @flaggo/sdk -- test/tetris-bootstrap-atomic.test.mjs
      - run: npm run test:tetris-integration
