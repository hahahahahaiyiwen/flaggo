name: Contracts

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: contracts/conformance/requirements.txt
      - run: python -m pip install -r contracts/conformance/requirements.txt
      - run: python -m unittest discover -s contracts/conformance -p "test_*.py"
      - run: python -m unittest discover -s tools/core-parity -p "test_*.py"
      - run: python tools/dev.py check

  sdk-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run check:generated
      - run: npm run check:openapi
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:package

  rust-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/async-analysis/requirements.txt
      - name: Prepare analysis Python environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r apps/async-analysis/requirements.txt
      - run: rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  tetris-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/async-analysis/requirements.txt
      - name: Prepare analysis Python environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r apps/async-analysis/requirements.txt
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: npm ci
      - run: npm run test:tetris-app
      - run: npm run test:tetris-integration
      - run: npm run test:tetris-full-loop
      - run: npm run test:tetris-playground
      - run: npx playwright install --with-deps chromium
      - run: npm run test:tetris-playground:browser
      - run: npm run test:tetris-playground:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: phase5-exit-diagnostics
          path: examples/tetris-playground/test-results/

  adaptive-worker-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: npm ci
      - run: npm run test:adaptive-worker
