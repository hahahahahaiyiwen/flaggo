[package]
name = "flaggo-raw-otlp-inbox"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["sqlite"]
sqlite = ["dep:sha2", "dep:sqlx"]

[dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
sha2 = { version = "0.10.9", optional = true }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"], optional = true }
thiserror = "2.0.18"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync"] }

[lints]
workspace = true
