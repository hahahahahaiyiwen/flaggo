[package]
name = "flaggo-analysis-execution"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["local"]
local = ["flaggo-analysis-workspace/local", "tokio/process", "tokio/fs"]

[dependencies]
async-trait = "0.1.89"
flaggo-analysis-agent = { path = "../analysis-agent" }
flaggo-analysis-domain = { path = "../analysis-domain" }
flaggo-analysis-workspace = { path = "../analysis-workspace", default-features = false }
flaggo-evidence-store = { path = "../evidence-store", default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
