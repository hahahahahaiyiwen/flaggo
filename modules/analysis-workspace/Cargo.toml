[package]
name = "flaggo-analysis-workspace"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["local"]
local = ["dep:tempfile", "dep:uuid"]

[dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde", "std"] }
flaggo-analysis-domain = { version = "0.1.0", path = "../analysis-domain" }
flaggo-contract = { version = "0.1.0", path = "../contract" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
tracing.workspace = true
tempfile = { version = "3.27.0", optional = true }
uuid = { version = "1.18.1", features = ["v4"], optional = true }

[dev-dependencies]
tokio.workspace = true

[lints]
workspace = true
