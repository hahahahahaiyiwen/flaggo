[package]
name = "flaggo-executable-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["sqlite"]
sqlite = ["dep:sqlx", "dep:tokio", "flaggo-contract-store/sqlite"]

[dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = ["std", "clock"] }
flaggo-contract = { path = "../contract" }
flaggo-contract-store = { path = "../contract-store", default-features = false }
flaggo-decision = { path = "../decision" }
flaggo-expression = { path = "../expression" }
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.9.0", optional = true, default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "2.0.18"
tokio = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
