[package]
name = "flaggo-analysis-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
copilot = ["dep:github-copilot-sdk", "dep:schemars"]

[dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde", "std"] }
flaggo-analysis-domain = { version = "0.1.0", path = "../analysis-domain" }
flaggo-analysis-workspace = { version = "0.1.0", path = "../analysis-workspace" }
github-copilot-sdk = { version = "1.0.17-preview.5", default-features = false, features = ["derive", "runtime"], optional = true }
schemars = { version = "1.2.2", optional = true }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
