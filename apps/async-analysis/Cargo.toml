[package]
name = "flaggo-async-analysis"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "flaggo-async-analysis"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde", "std"] }
flaggo-analysis-agent = { version = "0.1.0", path = "../../modules/analysis-agent", features = ["copilot"] }
flaggo-analysis-domain = { version = "0.1.0", path = "../../modules/analysis-domain" }
flaggo-analysis-workspace = { version = "0.1.0", path = "../../modules/analysis-workspace" }
flaggo-evidence-store = { version = "0.1.0", path = "../../modules/evidence-store" }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
serde.workspace = true
serde_json.workspace = true
thiserror = "2.0.18"
tokio = { workspace = true, features = ["fs", "time"] }
uuid = { version = "1.18.1", features = ["v4"] }

[dev-dependencies]
axum.workspace = true
tempfile = "3.27.0"
tower.workspace = true

[lints]
workspace = true
