[package]
name = "flaggo-cel-parity-probe"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
cel = { version = "=0.15.0", default-features = false, features = ["json", "parser_pratt"] }
flaggo-contract = { path = "../../../modules/contract" }
flaggo-expression = { path = "../../../modules/expression" }
flaggo-decision = { path = "../../../modules/decision" }
flaggo-contract-store = { path = "../../../modules/contract-store" }
flaggo-executable-store = { path = "../../../modules/executable-store" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.53.1", features = ["rt", "time"] }
thiserror = "2.0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "=0.2.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
