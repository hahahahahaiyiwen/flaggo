{
  "openapi": "3.1.0",
  "info": {
    "title": "Flaggo Management API",
    "version": "3.0.0",
    "description": "Management API for authority-bound, named, versioned DecisionContract resources. A contract name identifies the logical resource within its declared authority and contractDigest identifies one immutable scoped version. Strict management wire models live in ../schemas/management-models-v3.schema.json, shared health models live in ../schemas/runtime-models-v3.schema.json, and errors use ../schemas/problem-details-v3.schema.json.",
    "license": {
      "name": "Apache-2.0"
    }
  },
  "servers": [
    {
      "url": "https://contracts.flaggo.dev",
      "description": "Contract Service"
    },
    {
      "url": "http://localhost:8080",
      "description": "Local development"
    }
  ],
  "security": [
    {
      "oauth2": []
    }
  ],
  "tags": [
    {
      "name": "decision-contracts",
      "description": "Named DecisionContract resources and their immutable digest versions"
    },
    {
      "name": "health",
      "description": "Liveness and readiness"
    }
  ],
  "paths": {
    "/v3/decision-contract-catalog/current": {
      "get": {
        "tags": [
          "decision-contracts"
        ],
        "operationId": "getCurrentContractCatalog",
        "summary": "Get the cross-authority current-contract catalog.",
        "description": "Returns every current deployed DecisionContract in deterministic authority/name/digest order for Evidence Materializer. The response ETag is opaque transport change-detection metadata only; it is not a contract, evidence, provenance, or checkpoint identity.",
        "security": [
          {
            "oauth2": [
              "flaggo.contracts:materialize"
            ]
          }
        ],
        "parameters": [
          {
            "$ref": "#/components/parameters/IfNoneMatchHeader"
          },
          {
            "$ref": "#/components/parameters/CorrelationIdHeader"
          }
        ],
        "responses": {
          "200": {
            "$ref": "#/components/responses/CurrentContractCatalog"
          },
          "304": {
            "description": "The current contract catalog matches If-None-Match.",
            "headers": {
              "ETag": {
                "$ref": "#/components/headers/ContractCatalogEtag"
              },
              "X-Flaggo-Correlation-Id": {
                "$ref": "#/components/headers/CorrelationId"
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Problem"
          },
          "403": {
            "$ref": "#/components/responses/Problem"
          },
          "503": {
            "$ref": "#/components/responses/Problem"
          }
        }
      }
    },
    "/v3/decision-contracts/{contractName}": {
      "put": {
        "tags": [
          "decision-contracts"
        ],
        "operationId": "deployDecisionContract",
        "summary": "Deploy a named DecisionContract.",
        "description": "Validates the authority-bound payload, requires its name to equal contractName, computes contractDigest over its authority and semantic content, durably creates the immutable scoped version when new, generates and activates its default executable, and then moves that authority's named current-version pointer. Older digest activations remain available. Repeating the same scoped semantic payload is idempotent and returns the existing version; non-semantic-only changes do not create a version.",
        "security": [
          {
            "oauth2": [
              "flaggo.contracts:accept"
            ]
          }
        ],
        "parameters": [
          {
            "$ref": "#/components/parameters/ContractNamePath"
          },
          {
            "$ref": "#/components/parameters/CorrelationIdHeader"
          }
        ],
        "requestBody": {
          "$ref": "#/components/requestBodies/DecisionContract"
        },
        "responses": {
          "200": {
            "$ref": "#/components/responses/DecisionContractVersion"
          },
          "201": {
            "$ref": "#/components/responses/CreatedDecisionContractVersion"
          },
          "400": {
            "$ref": "#/components/responses/Problem"
          },
          "401": {
            "$ref": "#/components/responses/Problem"
          },
          "403": {
            "$ref": "#/components/responses/Problem"
          },
          "409": {
            "$ref": "#/components/responses/Problem"
          },
          "415": {
            "$ref": "#/components/responses/Problem"
          },
          "422": {
            "$ref": "#/components/responses/Problem"
          },
          "503": {
            "$ref": "#/components/responses/Problem"
          }
        }
      },
      "get": {
        "tags": [
          "decision-contracts"
        ],
        "operationId": "getCurrentDecisionContract",
        "summary": "Get the current accepted version of a named DecisionContract.",
        "description": "Returns the version selected by the named management resource's currentContractDigest pointer. This convenience lookup is for management only; runtime requests must carry an exact contractDigest and never resolve current implicitly.",
        "security": [
          {
            "oauth2": [
              "flaggo.contracts:read"
            ]
          }
        ],
        "parameters": [
          {
            "$ref": "#/components/parameters/ContractNamePath"
          },
          {
            "$ref": "#/components/parameters/CorrelationIdHeader"
          }
        ],
        "responses": {
          "200": {
            "$ref": "#/components/responses/DecisionContractVersion"
          },
          "401": {
            "$ref": "#/components/responses/Problem"
          },
          "403": {
            "$ref": "#/components/responses/Problem"
          },
          "404": {
            "$ref": "#/components/responses/Problem"
          }
        }
      }
    },
    "/v3/decision-contracts/{contractName}/validate": {
      "post": {
        "tags": [
          "decision-contracts"
        ],
        "operationId": "validateDecisionContract",
        "summary": "Dry-run validation for one named DecisionContract.",
        "description": "Requires the payload name to equal contractName, then parses and type-checks the authority-bound contract, validates supported JSON Schema and CEL profiles, verifies cross-references and defaults, canonicalizes authority and semantic content, and computes the proposed scoped contractDigest without mutation. Well-formed but semantically invalid content returns 200 with status invalid.",
        "security": [
          {
            "oauth2": [
              "flaggo.contracts:validate"
            ]
          }
        ],
        "parameters": [
          {
            "$ref": "#/components/parameters/ContractNamePath"
          },
          {
            "$ref": "#/components/parameters/CorrelationIdHeader"
          }
        ],
        "requestBody": {
          "$ref": "#/components/requestBodies/DecisionContract"
        },
        "responses": {
          "200": {
            "description": "Validation result with status valid or invalid.",
            "headers": {
              "X-Flaggo-Correlation-Id": {
                "$ref": "#/components/headers/CorrelationId"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/management-models-v3.schema.json#/$defs/DecisionContractValidationResult"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Problem"
          },
          "401": {
            "$ref": "#/components/responses/Problem"
          },
          "403": {
            "$ref": "#/components/responses/Problem"
          },
          "409": {
            "$ref": "#/components/responses/Problem"
          },
          "415": {
            "$ref": "#/components/responses/Problem"
          }
        }
      }
    },
    "/v3/decision-contracts/{contractName}/versions": {
      "get": {
        "tags": [
          "decision-contracts"
        ],
        "operationId": "listDecisionContractVersions",
        "summary": "List immutable versions of a named DecisionContract.",
        "description": "Returns accepted versions ordered by acceptedAt descending and then contractDigest descending. Pagination uses an opaque stable cursor. Ordering is management history and never authorizes runtime to select an implicit latest digest.",
        "security": [
          {
            "oauth2": [
              "flaggo.contracts:read"
            ]
          }
        ],
        "parameters": [
          {
            "$ref": "#/components/parameters/ContractNamePath"
          },
          {
            "$ref": "#/components/parameters/PageLimitQuery"
          },
          {
            "$ref": "#/components/parameters/PageCursorQuery"
          },
          {
            "$ref": "#/components/parameters/CorrelationIdHeader"
          }
        ],
        "responses": {
          "200": {
            "$ref": "#/components/responses/DecisionContractVersionList"
          },
          "400": {
            "$ref": "#/components/responses/Problem"
          },
          "401": {
            "$ref": "#/components/responses/Problem"
          },
          "403": {
            "$ref": "#/components/responses/Problem"
          },
          "404": {
            "$ref": "#/components/responses/Problem"
          }
        }
      }
    },
    "/v3/decision-contracts/{contractName}/versions/{contractDigest}": {
      "get": {
        "tags": [
          "decision-contracts"
        ],
        "operationId": "getDecisionContractVersion",
        "summary": "Get one immutable DecisionContract version.",
        "description": "Returns the exact digest version only when it belongs to the named DecisionContract within the authenticated application and environment scope.",
        "security": [
          {
            "oauth2": [
              "flaggo.contracts:read"
            ]
          }
        ],
        "parameters": [
          {
            "$ref": "#/components/parameters/ContractNamePath"
          },
          {
            "$ref": "#/components/parameters/ContractDigestPath"
          },
          {
            "$ref": "#/components/parameters/CorrelationIdHeader"
          }
        ],
        "responses": {
          "200": {
            "$ref": "#/components/responses/DecisionContractVersion"
          },
          "401": {
            "$ref": "#/components/responses/Problem"
          },
          "403": {
            "$ref": "#/components/responses/Problem"
          },
          "404": {
            "$ref": "#/components/responses/Problem"
          }
        }
      }
    },
    "/health/live": {
      "get": {
        "tags": [
          "health"
        ],
        "operationId": "healthLive",
        "summary": "Liveness probe. No external dependency checks.",
        "security": [],
        "responses": {
          "200": {
            "description": "Process can serve the handler.",
            "headers": {
              "X-Flaggo-Correlation-Id": {
                "$ref": "#/components/headers/CorrelationId"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/runtime-models-v3.schema.json#/$defs/LivenessResult"
                }
              }
            }
          }
        }
      }
    },
    "/health/ready": {
      "get": {
        "tags": [
          "health"
        ],
        "operationId": "healthReady",
        "summary": "Readiness probe over required and optional dependencies.",
        "description": "200 ready requires every check up. 200 degraded is allowed when only optional checks are impaired. Any required check that is not up returns 503 not-ready.",
        "security": [],
        "responses": {
          "200": {
            "description": "Ready or degraded readiness.",
            "headers": {
              "X-Flaggo-Correlation-Id": {
                "$ref": "#/components/headers/CorrelationId"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/runtime-models-v3.schema.json#/$defs/ReadinessResult"
                }
              }
            }
          },
          "503": {
            "description": "Not-ready: a required dependency is not up.",
            "headers": {
              "X-Flaggo-Correlation-Id": {
                "$ref": "#/components/headers/CorrelationId"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/runtime-models-v3.schema.json#/$defs/ReadinessResult"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "oauth2": {
        "type": "oauth2",
        "description": "OAuth 2.0/OIDC bearer access tokens. Authorization scopes are read from scope and scp. Every deployed DecisionContract declares the authority covered by its digest; a future credential-derived authority may constrain that declaration. Local development may explicitly enable an insecure bypass, disabled by default.",
        "flows": {
          "clientCredentials": {
            "tokenUrl": "https://auth.flaggo.dev/oauth2/token",
            "scopes": {
              "flaggo.contracts:validate": "Dry-run validation for named DecisionContracts",
              "flaggo.contracts:accept": "Create immutable DecisionContract versions and move the named current pointer",
              "flaggo.contracts:read": "Read current and historical DecisionContract versions",
              "flaggo.contracts:materialize": "Read the cross-authority current-contract catalog"
            }
          }
        }
      }
    },
    "parameters": {
      "ContractNamePath": {
        "name": "contractName",
        "in": "path",
        "required": true,
        "description": "Stable user-owned identity of the named DecisionContract resource. A request payload name must match this value.",
        "schema": {
          "$ref": "../schemas/management-models-v3.schema.json#/$defs/DecisionName"
        }
      },
      "ContractDigestPath": {
        "name": "contractDigest",
        "in": "path",
        "required": true,
        "description": "Exact immutable version digest covering the declared authority and semantic DecisionContract content.",
        "schema": {
          "$ref": "../schemas/management-models-v3.schema.json#/$defs/Sha256Digest"
        }
      },
      "PageLimitQuery": {
        "name": "limit",
        "in": "query",
        "required": false,
        "description": "Maximum number of versions to return.",
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 200,
          "default": 50
        }
      },
      "PageCursorQuery": {
        "name": "cursor",
        "in": "query",
        "required": false,
        "description": "Opaque cursor returned by the previous page.",
        "schema": {
          "type": "string",
          "minLength": 1
        }
      },
      "CorrelationIdHeader": {
        "name": "X-Flaggo-Correlation-Id",
        "in": "header",
        "required": false,
        "description": "Optional client-supplied tracing correlation ID.",
        "schema": {
          "type": "string"
        }
      },
      "IfNoneMatchHeader": {
        "name": "If-None-Match",
        "in": "header",
        "required": false,
        "description": "Previously observed quoted opaque contract-catalog ETag.",
        "schema": {
          "type": "string"
        }
      }
    },
    "headers": {
      "CorrelationId": {
        "description": "Server request-correlation identifier returned on every response.",
        "schema": {
          "type": "string"
        }
      },
      "Location": {
        "description": "URI of the exact immutable DecisionContract version.",
        "schema": {
          "type": "string",
          "format": "uri-reference"
        }
      },
      "ContractCatalogEtag": {
        "description": "Quoted opaque current-contract catalog revision used only for conditional retrieval.",
        "schema": {
          "type": "string"
        }
      }
    },
    "requestBodies": {
      "DecisionContract": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../schemas/management-models-v3.schema.json#/$defs/DecisionContract"
            }
          }
        }
      }
    },
    "responses": {
      "DecisionContractVersion": {
        "description": "One immutable accepted DecisionContract version that is runtime-ready.",
        "headers": {
          "X-Flaggo-Correlation-Id": {
            "$ref": "#/components/headers/CorrelationId"
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../schemas/management-models-v3.schema.json#/$defs/DecisionContractVersion"
            }
          }
        }
      },
      "CreatedDecisionContractVersion": {
        "description": "A newly created immutable DecisionContract version that is runtime-ready.",
        "headers": {
          "Location": {
            "$ref": "#/components/headers/Location"
          },
          "X-Flaggo-Correlation-Id": {
            "$ref": "#/components/headers/CorrelationId"
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../schemas/management-models-v3.schema.json#/$defs/DecisionContractVersion"
            }
          }
        }
      },
      "DecisionContractVersionList": {
        "description": "A cursor-paginated page of immutable DecisionContract version summaries.",
        "headers": {
          "X-Flaggo-Correlation-Id": {
            "$ref": "#/components/headers/CorrelationId"
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../schemas/management-models-v3.schema.json#/$defs/DecisionContractVersionList"
            }
          }
        }
      },
      "CurrentContractCatalog": {
        "description": "Deterministic cross-authority current deployed-contract catalog.",
        "headers": {
          "ETag": {
            "$ref": "#/components/headers/ContractCatalogEtag"
          },
          "X-Flaggo-Correlation-Id": {
            "$ref": "#/components/headers/CorrelationId"
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../schemas/management-models-v3.schema.json#/$defs/CurrentContractCatalog"
            }
          }
        }
      },
      "Problem": {
        "description": "RFC 9457 Problem Details error. Programs branch on the problem type URI and HTTP status, never on title or detail.",
        "headers": {
          "X-Flaggo-Correlation-Id": {
            "$ref": "#/components/headers/CorrelationId"
          }
        },
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../schemas/problem-details-v3.schema.json"
            }
          }
        }
      }
    }
  }
}
