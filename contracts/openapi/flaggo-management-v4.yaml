    "/health/ready": {
      "get": {
        "tags": [
          "health"
        ],
        "operationId": "healthReady",
        "summary": "Readiness probe over required and optional dependencies.",
        "description": "200 ready requires every check up. 200 degraded is allowed when only optional checks are impaired. Any required check that is not up returns 503 not-ready.",
        "responses": {
          "200": {
            "description": "Ready or degraded readiness.",
            "headers": {
              "X-Flaggo-Correlation-Id": {
                "$ref": "#/components/headers/CorrelationId"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/runtime-models-v4.schema.json#/$defs/ReadinessResult"
                }
              }
            }
          },
          "503": {
            "description": "Not-ready: a required dependency is not up.",
            "headers": {
              "X-Flaggo-Correlation-Id": {
                "$ref": "#/components/headers/CorrelationId"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../schemas/runtime-models-v4.schema.json#/$defs/ReadinessResult"
                }
              }
            }
          }
        },
        "x-flaggo-authentication": {
          "capability": "flaggo.security.resource/v1",
          "required": false,
          "mechanism": "host-defined"
        }
      }
    }
  },
  "components": {
    "parameters": {
      "ContractNamePath": {
        "name": "contractName",
        "in": "path",
        "required": true,
        "description": "Stable user-owned identity of the named DecisionContract resource. A request payload name must match this value.",
        "schema": {
          "$ref": "../schemas/management-models-v4.schema.json#/$defs/DecisionName"
        }
      },
      "ContractDigestPath": {
        "name": "contractDigest",
        "in": "path",
        "required": true,
        "description": "Exact immutable version digest covering the declared authority and semantic DecisionContract content.",
        "schema": {
          "$ref": "../schemas/management-models-v4.schema.json#/$defs/Sha256Digest"
        }
      },
      "ExecutableDigestPath": {
        "name": "executableDigest",
        "in": "path",
        "required": true,
        "description": "Exact immutable executable digest.",
        "schema": {
          "type": "string",
          "pattern": "^sha256:[0-9a-f]{64}$"
        }
      },
      "PageLimitQuery": {
        "name": "limit",
        "in": "query",
        "required": false,
        "description": "Maximum number of resources to return.",
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 200,
          "default": 50
        }
      },
      "PageCursorQuery": {
        "name": "cursor",
        "in": "query",
        "required": false,
        "description": "Opaque cursor returned by the previous page.",
        "schema": {
          "type": "string",
          "minLength": 1
        }
      },
      "CorrelationIdHeader": {
        "name": "X-Flaggo-Correlation-Id",
        "in": "header",
        "required": false,
        "description": "Optional client-supplied tracing correlation ID.",
        "schema": {
          "type": "string"
        }
      },
      "IfNoneMatchHeader": {
        "name": "If-None-Match",
        "in": "header",
        "required": false,
        "description": "Previously observed quoted opaque contract-catalog ETag.",
        "schema": {
          "type": "string"
        }
      },
      "TenantPath": {
        "name": "tenant",
        "in": "path",
        "required": true,
        "description": "Explicit resource identity, not an authentication credential.",
        "schema": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128,
          "pattern": "^[A-Za-z][A-Za-z0-9._-]*$"
        }
      },
      "ApplicationPath": {
        "name": "application",
        "in": "path",
        "required": true,
        "description": "Explicit resource identity, not an authentication credential.",
        "schema": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128,
          "pattern": "^[A-Za-z][A-Za-z0-9._-]*$"
        }
      },
      "EnvironmentPath": {
        "name": "environment",
        "in": "path",
        "required": true,
        "description": "Explicit resource identity, not an authentication credential.",
        "schema": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128,
          "pattern": "^[A-Za-z][A-Za-z0-9._-]*$"
        }
      }
    },
    "headers": {
      "CorrelationId": {
        "description": "Server request-correlation identifier returned on every response.",
        "schema": {
          "type": "string"
        }
      },
      "Location": {
        "description": "URI of the exact immutable DecisionContract version.",
        "schema": {
          "type": "string",
          "format": "uri-reference"
        }
      },
      "ContractCatalogEtag": {
        "description": "Quoted opaque current-contract catalog revision used only for conditional retrieval.",
        "schema": {
          "type": "string"
        }
      }
    },
    "requestBodies": {
      "DecisionContract": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../schemas/management-models-v4.schema.json#/$defs/DecisionContract"
            }
          }
        }
      },
      "AnalysisCandidateSubmission": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../schemas/management-models-v4.schema.json#/$defs/AnalysisCandidateSubmission"
            }
          }
        }
      },
      "DecisionExecutableActivation": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../schemas/management-models-v4.schema.json#/$defs/DecisionExecutableActivationRequest"
            }
          }
        }
      }
    },
    "responses": {
      "DecisionExecutableHistory": {
        "description": "One page of retained active, candidate, and inactive executable records.",
        "headers": {
          "X-Flaggo-Correlation-Id": {
            "$ref": "#/components/headers/CorrelationId"
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../schemas/management-models-v4.schema.json#/$defs/DecisionExecutableHistory"
            }
          }
        }
      },
      "DecisionContractVersion": {
        "description": "One immutable accepted DecisionContract version that is runtime-ready.",
        "headers": {
          "X-Flaggo-Correlation-Id": {
            "$ref": "#/components/headers/CorrelationId"
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../schemas/management-models-v4.schema.json#/$defs/DecisionContractVersion"
            }
          }
        }
      },
      "CreatedDecisionContractVersion": {
        "description": "A newly created immutable DecisionContract version that is runtime-ready.",
        "headers": {
          "Location": {
            "$ref": "#/components/headers/Location"
          },
          "X-Flaggo-Correlation-Id": {
            "$ref": "#/components/headers/CorrelationId"
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../schemas/management-models-v4.schema.json#/$defs/DecisionContractVersion"
            }
          }
        }
      },
      "DecisionContractVersionList": {
        "description": "A cursor-paginated page of immutable DecisionContract version summaries.",
        "headers": {
          "X-Flaggo-Correlation-Id": {
            "$ref": "#/components/headers/CorrelationId"
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../schemas/management-models-v4.schema.json#/$defs/DecisionContractVersionList"
            }
          }
        }
      },
      "CurrentContractCatalog": {
        "description": "Current deployed contracts within one explicitly authorized resource scope.",
        "headers": {
          "ETag": {
            "$ref": "#/components/headers/ContractCatalogEtag"
          },
          "X-Flaggo-Correlation-Id": {
            "$ref": "#/components/headers/CorrelationId"
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../schemas/management-models-v4.schema.json#/$defs/CurrentContractCatalog"
            }
          }
        }
      },
      "AnalysisCandidate": {
        "description": "The existing admission for the exact workspace cycle, including its current candidate, active, or inactive lifecycle.",
        "headers": {
          "X-Flaggo-Correlation-Id": {
            "$ref": "#/components/headers/CorrelationId"
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../schemas/management-models-v4.schema.json#/$defs/AnalysisCandidateResult"
            }
          }
        }
      },
      "CreatedAnalysisCandidate": {
        "description": "A newly persisted inactive Candidate with no runtime authority.",
        "headers": {
          "X-Flaggo-Correlation-Id": {
            "$ref": "#/components/headers/CorrelationId"
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../schemas/management-models-v4.schema.json#/$defs/AnalysisCandidateResult"
            }
          }
        }
      },
      "DecisionExecutableCatalog": {
        "description": "Current runtime authority and one page of inactive Candidates for an exact contract version.",
        "headers": {
          "X-Flaggo-Correlation-Id": {
            "$ref": "#/components/headers/CorrelationId"
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../schemas/management-models-v4.schema.json#/$defs/DecisionExecutableCatalog"
            }
          }
        }
      },
      "DecisionExecutableActivation": {
        "description": "The newly active executable and the authority it replaced.",
        "headers": {
          "X-Flaggo-Correlation-Id": {
            "$ref": "#/components/headers/CorrelationId"
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../schemas/management-models-v4.schema.json#/$defs/DecisionExecutableActivationResult"
            }
          }
        }
      },
      "Problem": {
        "description": "RFC 9457 Problem Details error. Programs branch on the problem type URI and HTTP status, never on title or detail.",
        "headers": {
          "X-Flaggo-Correlation-Id": {
            "$ref": "#/components/headers/CorrelationId"
          }
        },
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "../schemas/problem-details-v4.schema.json"
            }
          }
        }
      }
    }
  }
}
