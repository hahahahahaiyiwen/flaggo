    "/v4/tenants/{tenant}/applications/{application}/environments/{environment}/decision-contracts/{contractName}/versions/{contractDigest}/candidates": {
      "post": {
        "tags": [
          "decision-contracts"
        ],
        "operationId": "submitAnalysisCandidate",
        "summary": "Admit an analysis Candidate for one exact current contract digest.",
        "description": "Validates and canonicalizes the proposed rules against the immutable contract version, fences first admission on that digest still being current, and atomically persists Candidate lifecycle state with workspace/cycle/attempt identity and the sealed analysisManifestDigest. The manifest records saved datasets and query times from live evidence queries; no cycle-wide evidence cutoff or watermark is accepted or implied. This operation never activates an executable. The contract name and digest come only from the route; retries must repeat the exact workspace-cycle submission. An exact retry returns the original admission with its current lifecycle without reopening or mutating it.",
        "parameters": [
          {
            "$ref": "#/components/parameters/TenantPath"
          },
          {
            "$ref": "#/components/parameters/ApplicationPath"
          },
          {
            "$ref": "#/components/parameters/EnvironmentPath"
          },
          {
            "$ref": "#/components/parameters/ContractNamePath"
          },
          {
            "$ref": "#/components/parameters/ContractDigestPath"
          },
          {
            "$ref": "#/components/parameters/CorrelationIdHeader"
          }
        ],
        "requestBody": {
          "$ref": "#/components/requestBodies/AnalysisCandidateSubmission"
        },
        "responses": {
          "200": {
            "$ref": "#/components/responses/AnalysisCandidate"
          },
          "201": {
            "$ref": "#/components/responses/CreatedAnalysisCandidate"
          },
          "400": {
            "$ref": "#/components/responses/Problem"
          },
          "404": {
            "$ref": "#/components/responses/Problem"
          },
          "409": {
            "$ref": "#/components/responses/Problem"
          },
          "415": {
            "$ref": "#/components/responses/Problem"
          },
          "422": {
            "$ref": "#/components/responses/Problem"
          },
          "503": {
            "$ref": "#/components/responses/Problem"
          },
          "401": {
            "description": "Missing or invalid independently authenticated identity.",
            "headers": {
              "WWW-Authenticate": {
                "schema": {
                  "type": "string"
                },
                "description": "Challenge supplied by the host authentication adapter."
              }
            },
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../schemas/problem-details-v4.schema.json"
                }
              }
            }
          },
          "403": {
            "$ref": "#/components/responses/Problem"
          }
        },
        "x-flaggo-authentication": {
          "capability": "flaggo.security.resource/v1",
          "required": true,
