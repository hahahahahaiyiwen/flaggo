          {
            "$ref": "#/components/parameters/TenantPath"
          },
          {
            "$ref": "#/components/parameters/ApplicationPath"
          },
          {
            "$ref": "#/components/parameters/EnvironmentPath"
          },
          {
            "$ref": "#/components/parameters/ContractNamePath"
          },
          {
            "$ref": "#/components/parameters/CorrelationIdHeader"
          }
        ],
        "responses": {
          "200": {
            "$ref": "#/components/responses/DecisionContractVersion"
          },
          "404": {
            "$ref": "#/components/responses/Problem"
          },
          "401": {
            "description": "Missing or invalid independently authenticated identity.",
            "headers": {
              "WWW-Authenticate": {
                "schema": {
                  "type": "string"
                },
                "description": "Challenge supplied by the host authentication adapter."
              }
            },
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../schemas/problem-details-v4.schema.json"
                }
              }
            }
          },
          "403": {
            "$ref": "#/components/responses/Problem"
          },
          "503": {
            "$ref": "#/components/responses/Problem"
          }
        },
        "x-flaggo-authentication": {
          "capability": "flaggo.security.resource/v1",
          "required": true,
          "mechanism": "host-defined"
        }
      }
    },
    "/v4/tenants/{tenant}/applications/{application}/environments/{environment}/decision-contracts/{contractName}/validate": {
      "post": {
        "tags": [
          "decision-contracts"
        ],
        "operationId": "validateDecisionContract",
        "summary": "Dry-run validation for one named DecisionContract.",
        "description": "Requires body authority and name to match the explicit route, then validates and computes the unchanged content digest without mutation. Semantic validation failures return status invalid.",
        "parameters": [
          {
            "$ref": "#/components/parameters/TenantPath"
          },
          {
            "$ref": "#/components/parameters/ApplicationPath"
          },
          {
            "$ref": "#/components/parameters/EnvironmentPath"
          },
          {
            "$ref": "#/components/parameters/ContractNamePath"
          },
          {
            "$ref": "#/components/parameters/CorrelationIdHeader"
          }
        ],
        "requestBody": {
          "$ref": "#/components/requestBodies/DecisionContract"
        },
        "responses": {
          "200": {
            "description": "Validation result with status valid or invalid.",
            "headers": {
              "X-Flaggo-Correlation-Id": {
                "$ref": "#/components/headers/CorrelationId"
              }
