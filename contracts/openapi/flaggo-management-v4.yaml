{
  "openapi": "3.1.0",
  "info": {
    "title": "Flaggo Management API",
    "version": "4.0.0",
    "description": "Breaking scoped v4 API. Resource identity is tenant/application/environment/name; contractDigest still covers unchanged authority and semantic content. Authentication is an independently supplied host capability, never inferred from route or body declarations. Missing or invalid identity returns 401, hidden scope/resource returns 404, and a visible but forbidden operation returns 403. Authority outages fail closed with 503. Trusted local composition explicitly opts out of credential checks. No hosted identity provider or token protocol is selected by this public contract.",
    "license": {
      "name": "Apache-2.0"
    }
  },
  "servers": [
    {
      "url": "https://contracts.flaggo.dev",
      "description": "Contract Service"
    },
    {
      "url": "http://localhost:8080",
      "description": "Local development"
    }
  ],
  "tags": [
    {
      "name": "decision-contracts",
      "description": "Named DecisionContract resources and their immutable digest versions"
    },
    {
      "name": "health",
      "description": "Liveness and readiness"
    }
  ],
  "paths": {
    "/v4/tenants/{tenant}/applications/{application}/environments/{environment}/decision-contract-catalog/current": {
      "get": {
        "tags": [
          "decision-contracts"
        ],
        "operationId": "getCurrentContractCatalog",
        "summary": "Get current contracts in one explicitly authorized scope.",
        "description": "Returns only current deployed contracts in the route scope. The ETag includes the scope and is transport change detection, not a provenance identity.",
        "parameters": [
          {
            "$ref": "#/components/parameters/TenantPath"
          },
          {
            "$ref": "#/components/parameters/ApplicationPath"
          },
          {
            "$ref": "#/components/parameters/EnvironmentPath"
          },
          {
            "$ref": "#/components/parameters/IfNoneMatchHeader"
          },
          {
            "$ref": "#/components/parameters/CorrelationIdHeader"
          }
        ],
        "responses": {
          "200": {
            "$ref": "#/components/responses/CurrentContractCatalog"
          },
          "304": {
            "description": "The current contract catalog matches If-None-Match.",
            "headers": {
              "ETag": {
                "$ref": "#/components/headers/ContractCatalogEtag"
              },
              "X-Flaggo-Correlation-Id": {
                "$ref": "#/components/headers/CorrelationId"
              }
            }
          },
          "503": {
            "$ref": "#/components/responses/Problem"
          },
          "401": {
            "description": "Missing or invalid independently authenticated identity.",
            "headers": {
              "WWW-Authenticate": {
                "schema": {
                  "type": "string"
                },
                "description": "Challenge supplied by the host authentication adapter."
              }
            },
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../schemas/problem-details-v4.schema.json"
                }
              }
            }
          },
          "403": {
            "$ref": "#/components/responses/Problem"
          },
          "404": {
            "$ref": "#/components/responses/Problem"
          }
        },
        "x-flaggo-authentication": {
          "capability": "flaggo.security.resource/v1",
          "required": true,
          "mechanism": "host-defined"
        }
      }
    },
    "/v4/tenants/{tenant}/applications/{application}/environments/{environment}/decision-contracts/{contractName}": {
      "put": {
        "tags": [
          "decision-contracts"
        ],
        "operationId": "deployDecisionContract",
        "summary": "Deploy a named DecisionContract.",
        "description": "Requires body authority and name to match the explicit route. Names are independent across scopes. Atomically publishes the immutable accepted version, bootstrap executable and current pointer. Existing payload bytes, digest semantics and idempotent retry behavior are unchanged.",
        "parameters": [
          {
            "$ref": "#/components/parameters/TenantPath"
          },
          {
            "$ref": "#/components/parameters/ApplicationPath"
          },
          {
            "$ref": "#/components/parameters/EnvironmentPath"
          },
          {
            "$ref": "#/components/parameters/ContractNamePath"
          },
          {
            "$ref": "#/components/parameters/CorrelationIdHeader"
          }
        ],
        "requestBody": {
          "$ref": "#/components/requestBodies/DecisionContract"
        },
        "responses": {
          "200": {
            "$ref": "#/components/responses/DecisionContractVersion"
          },
          "201": {
            "$ref": "#/components/responses/CreatedDecisionContractVersion"
          },
          "400": {
            "$ref": "#/components/responses/Problem"
          },
          "409": {
            "$ref": "#/components/responses/Problem"
          },
          "415": {
            "$ref": "#/components/responses/Problem"
          },
          "422": {
            "$ref": "#/components/responses/Problem"
          },
          "503": {
            "$ref": "#/components/responses/Problem"
          },
          "401": {
            "description": "Missing or invalid independently authenticated identity.",
            "headers": {
              "WWW-Authenticate": {
                "schema": {
                  "type": "string"
                },
                "description": "Challenge supplied by the host authentication adapter."
              }
            },
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../schemas/problem-details-v4.schema.json"
                }
              }
            }
          },
          "403": {
            "$ref": "#/components/responses/Problem"
          },
          "404": {
            "$ref": "#/components/responses/Problem"
          }
        },
        "x-flaggo-authentication": {
          "capability": "flaggo.security.resource/v1",
          "required": true,
          "mechanism": "host-defined"
        }
      },
      "get": {
        "tags": [
          "decision-contracts"
        ],
        "operationId": "getCurrentDecisionContract",
        "summary": "Get the current accepted version of a named DecisionContract.",
        "description": "Returns the version selected by the named management resource's currentContractDigest pointer. This convenience lookup is for management only; runtime requests must carry an exact contractDigest and never resolve current implicitly.",
