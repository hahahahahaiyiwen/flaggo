[package]
name = "flaggo-tetris-playground-analysis"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "flaggo-tetris-playground-analysis"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
flaggo-analysis-agent = { version = "0.1.0", path = "../../../modules/analysis-agent" }
flaggo-analysis-domain = { version = "0.1.0", path = "../../../modules/analysis-domain" }
flaggo-analysis-workspace = { version = "0.1.0", path = "../../../modules/analysis-workspace" }
flaggo-async-analysis = { version = "0.1.0", path = "../../../apps/async-analysis" }
flaggo-service-observability.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[lints]
workspace = true
